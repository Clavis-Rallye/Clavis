name: Bug
description: Something is not working as expected
title: "bug: "
type: Bug
labels: ["unconfirmed"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken? One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (browser, OS, build SHA / branch, deployed URL)
      placeholder: "Chrome 142 / macOS 15 / main@abc123 / the address of your installation"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / stack traces (optional)
      render: shell
