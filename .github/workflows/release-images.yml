name: Release images

# This workflow builds the release images and pushes them to the packages of this organisation.
# The rollout to an installation is not part of this repository, and the packages are private.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Images / build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clavis-api
            context: ./src/backend
          - image: clavis-frontend
            context: ./src/frontend
    steps:
      - name: The run is on a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Start this workflow on a release tag v*, not on a branch."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/clavis-rallye/${{ matrix.image }}
          flavor: |
            latest=false
          # A tag v1.2.3 gets `:1.2.3`, `:1.2` and the short sha, never `:latest`.
          # A run by hand is started on the release tag, never on a branch, so the ref,
          # the sha and the labels all belong to the tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
