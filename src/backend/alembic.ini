# Alembic configuration file for async SQLAlchemy migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug to 40 characters
truncate_slug_length = 40

# Timezone for migration timestamps
timezone = UTC

# Version locations for multiple branches
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator (for version_locations, use os.pathsep)
# version_path_separator = os  # default: use os.pathsep

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to search source files recursively in each sourcedir
# recursive_version_locations = false

# Output encoding
# output_encoding = utf-8

# Database URL placeholder - will be set programmatically in env.py from config
sqlalchemy.url =

[post_write_hooks]
# Hooks to run after migration files are generated
# Format: hook_name = command --args
# Example: black = black migrations/

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
