<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Clavis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1D47A4 0%, #6E84C4 100%);
      color: #1D1B20;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .offline-container {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0px 8px 12px 6px rgba(0, 0, 0, 0.15), 0px 4px 4px rgba(0, 0, 0, 0.3);
    }

    .offline-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      background: #FEF7FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      line-height: 36px;
      margin-bottom: 16px;
      color: #1D47A4;
    }

    p {
      font-size: 16px;
      line-height: 24px;
      color: #49454F;
      margin-bottom: 32px;
    }

    .retry-button {
      background: #1D47A4;
      color: #FFFFFF;
      border: none;
      border-radius: 100px;
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .retry-button:hover {
      background: #002378;
    }

    .retry-button:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #49454F;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      📡
    </div>
    <h1>Keine Internetverbindung</h1>
    <p>
      Du bist gerade offline. Bitte überprüfe deine Internetverbindung und versuche es erneut.
    </p>
    <button class="retry-button" onclick="location.reload()">
      Erneut versuchen
    </button>
    <div class="status" id="status"></div>
  </div>

  <script>
    function updateStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = 'Verbindung wiederhergestellt!';
        setTimeout(() => {
          location.reload();
        }, 1000);
      } else {
        status.textContent = 'Warte auf Verbindung...';
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    updateStatus();

    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
