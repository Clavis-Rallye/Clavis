# Security headers on the SPA document response. The pages are served with a
# strict Content Security Policy. The API sets its own headers in FastAPI
# middleware. This file covers everything served by the frontend nginx.
#
# This file is a TEMPLATE. At container start the nginx image's envsubst step
# fills ${MAP_TILE_ORIGIN}, the origin of MAP_TILE_URL, which
# /docker-entrypoint.d/10-map-tile-origin.envsh derives. Only variables that
# exist in the environment are substituted, so nginx's own runtime variables
# such as $host stay as they are.
#
# CSP allowances, each load-bearing:
#   style-src 'unsafe-inline'        — MUI/emotion injects <style> elements
#   img-src ${MAP_TILE_ORIGIN}       — Leaflet map tiles (MapPicker, StationList),
#     exactly the tile server the installation configured
#   img/media blob:                  — local previews of photo/video submissions
#   connect-src ${MAP_TILE_ORIGIN}   — tiles and the service worker's runtime
#     image cache, whose fetches are governed by connect-src (this CSP also
#     ships on the sw.js response)
#   connect-src ws://$host wss://$host — the realtime WebSocket; explicit
#     schemes because older Safari doesn't count ws/wss as 'self'
#   font-src data:                   — MUI's own icon/font fallbacks load as
#     data: URIs (observed via country-flag-emoji-polyfill's injected face)
#
# nginx add_header inheritance gotcha: a location{} with its OWN add_header
# discards ALL inherited add_header directives. Every location below that
# sets one must repeat the security set, kept in sync by hand.

map $host $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${MAP_TILE_ORIGIN}; media-src 'self' blob:; connect-src 'self' ws://$host wss://$host ${MAP_TILE_ORIGIN}; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $csp_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # The standalone network diagnostic is a self-contained page with an
    # inline script, so it gets its own CSP instead of an 'unsafe-inline' in
    # the app-wide one. It may contact this server only.
    location = /netcheck.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. The add_header here discards the server-level
    # set (see the gotcha above), so the security headers are repeated.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
